spring.datasource.url=jdbc:h2:mem:cardpay;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
server.port=8080

# Flyway: H2 개발 환경에서는 Hibernate DDL auto 사용, MySQL 프로파일에서만 활성화
spring.flyway.enabled=false

# JWT — JWT_SECRET 환경변수로 주입, 미설정 시 개발용 기본값 사용
jwt.secret=${JWT_SECRET:QXRvbVBheVNlY3JldEtleTIwMjZGb3JKV1RTaWduaW5nSFMyNTY=}
jwt.expiration-ms=3600000

# 결제 API 레이트 리밋: actor(인증된 username)당 window-seconds 동안 limit건
ratelimit.payments.limit=30
ratelimit.payments.window-seconds=10

# Structured logging: include correlation ID from MDC
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] [%X{requestId:-no-request-id}] %-5level %logger{36} - %msg%n

# Actuator: expose health endpoint
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
