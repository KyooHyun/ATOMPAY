spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cardpay?useSSL=false&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:changeit}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false

# Flyway: MySQL 프로파일에서 스키마 마이그레이션 활성화
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# 운영 경로에서는 개발용 기본 시크릿으로 기동되면 안 된다: 누구나 아는 키로
# 서명된 토큰이 통과하게 된다. JWT_SECRET이 없으면 기동 자체를 실패시킨다.
jwt.secret=${JWT_SECRET}
