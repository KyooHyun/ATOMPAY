name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit + MySQL concurrency tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers uses the runner's Docker daemon for the MySQL tests.
      - run: mvn -B clean verify
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  smoke:
    name: Production profile smoke test (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start app + MySQL (mysql profile, Flyway, ddl-auto=validate)
        run: |
          export JWT_SECRET=$(openssl rand -base64 32)
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          docker compose up -d --build
      - name: Run lifecycle over real HTTP
        run: bash scripts/smoke-test.sh
      - if: failure()
        run: docker compose logs app
      - if: always()
        run: docker compose down -v
